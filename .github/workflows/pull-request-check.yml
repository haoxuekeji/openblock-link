name: Pull Request Check

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 24 is the release baseline (see OB-030/OB-031 release manifests).
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm test
